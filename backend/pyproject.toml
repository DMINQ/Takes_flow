[project]
name = "takeflow-backend"
version = "0.1.0"
description = "AI-assisted voiceover/dialogue editor — transcription, silence & bad-take detection, mastering export."
requires-python = ">=3.12"

# Canonical dependency list. uv resolves these into uv.lock (the source of truth
# for Docker builds). Pin meaningfully; keep dev/test tooling in the groups below.
dependencies = [
    # --- Web / API ---
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    # --- Messaging / worker (FastStream over Redis — same API as RabbitMQ, lighter) ---
    "faststream[redis]==0.5.34",
    # --- Database (async SQLAlchemy 2.0 + psycopg v3) ---
    "sqlalchemy==2.0.37",
    "psycopg[binary]==3.2.4",
    "alembic==1.14.1",
    # --- Transcription (word-level timestamps) ---
    "faster-whisper==1.1.1",
    "requests==2.32.3",       # faster-whisper 1.1.1 imports it but doesn't declare it
    # --- Diarization (speaker turns) ---
    # torch/torchaudio resolve to CUDA 12.1 wheels (see [tool.uv.sources] below)
    # so the worker can run pyannote.audio on GPU out of the box.
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "pyannote-audio==3.3.2",
    # pyannote-audio 3.3.2 still calls hf_hub_download(use_auth_token=...), which
    # huggingface_hub>=0.26 removed in favor of token=. Pin below that line.
    "huggingface-hub<0.26",
    # pyannote-audio imports matplotlib in some pipeline code paths even though
    # nothing here renders plots — an unstated dependency of theirs.
    "matplotlib==3.10.0",
    # Custom diarizer (DIARIZER_PROVIDER=custom): hand-rolled VAD+embedding+HDBSCAN clustering.
    "hdbscan==0.8.40",
    "scikit-learn==1.6.1",
    # --- Media / audio processing ---
    "ffmpeg-python==0.2.0",
    "pedalboard==0.9.16",
    "pydub==0.25.1",
    "pyloudnorm==0.1.1",      # BS.1770-4 LUFS metering for export mastering (Step 7)
    "soundfile==0.12.1",      # reads/writes wav as numpy arrays for pedalboard/pyloudnorm
    # --- NLP: bad-take / duplicate detection ---
    "thefuzz==0.22.1",
    # --- Misc ---
    "httpx==0.28.1",          # remote provider adapters (remote whisper/llm)
    "python-magic==0.4.27",   # MIME sniffing for uploads
    "aioboto3==13.3.0",
]

[dependency-groups]
# `uv run --group <name> ...` installs only that group (plus the base deps).
# `dev` aggregates both and is uv's implicit default group, so `uv sync
# --no-dev` (used by the Dockerfile) continues to skip all of this in images.
lint = ["ruff==0.9.2", "black==24.10.0", "ty==0.0.1a20"]
tests = ["pytest==8.3.4", "anyio==4.8.0", "pytest-asyncio==0.25.2"]
dev = [{include-group = "lint"}, {include-group = "tests"}, "ipdb"]

[tool.uv]
# Keep the project itself non-installed in Docker's dep layer (see Dockerfile);
# this caches the venv independently of source changes.
package = false

[[tool.uv.index]]
# CUDA 12.1 wheels for torch/torchaudio — PyPI only ships CPU wheels. Pin the
# diarizer's stack to these so `uv sync` gives the worker GPU support without
# a separate requirements file. If you deploy on CPU-only hardware, drop this
# index and the two [tool.uv.sources] entries below (pip then resolves the
# plain CPU wheels from PyPI) and set DIARIZER_DEVICE=cpu.
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The project is not installed (tool.uv package = false), so `src` is imported
# from the repo root.
pythonpath = ["."]
