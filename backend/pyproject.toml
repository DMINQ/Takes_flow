[project]
name = "takeflow-backend"
version = "0.1.0"
description = "AI-assisted voiceover/dialogue editor — transcription, silence & bad-take detection, mastering export."
requires-python = ">=3.12"

# Canonical dependency list. uv resolves these into uv.lock (the source of truth
# for Docker builds). Pin meaningfully; keep dev/test tooling in the groups below.
dependencies = [
    # --- Web / API ---
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    # --- Messaging / worker (FastStream over Redis — same API as RabbitMQ, lighter) ---
    "faststream[redis]==0.5.34",
    # --- Database (async SQLAlchemy 2.0 + psycopg v3) ---
    "sqlalchemy==2.0.37",
    "psycopg[binary]==3.2.4",
    "alembic==1.14.1",
    # --- Transcription (word-level timestamps) ---
    "faster-whisper==1.1.1",
    "requests==2.32.3",       # faster-whisper 1.1.1 imports it but doesn't declare it
    # --- Media / audio processing ---
    "ffmpeg-python==0.2.0",
    "pedalboard==0.9.16",
    "pydub==0.25.1",
    # --- NLP: bad-take / duplicate detection ---
    "thefuzz==0.22.1",
    # --- Misc ---
    "httpx==0.28.1",          # remote provider adapters (remote whisper/llm)
    "python-magic==0.4.27",   # MIME sniffing for uploads
    "aioboto3==13.3.0",
]

[dependency-groups]
# `uv run --group <name> ...` installs only that group (plus the base deps).
# `dev` aggregates both and is uv's implicit default group, so `uv sync
# --no-dev` (used by the Dockerfile) continues to skip all of this in images.
lint = ["ruff==0.9.2", "black==24.10.0"]
tests = ["pytest==8.3.4", "anyio==4.8.0", "pytest-asyncio==0.25.2"]
dev = [{include-group = "lint"}, {include-group = "tests"}, "ipdb"]

[tool.uv]
# Keep the project itself non-installed in Docker's dep layer (see Dockerfile);
# this caches the venv independently of source changes.
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The project is not installed (tool.uv package = false), so `src` is imported
# from the repo root.
pythonpath = ["."]
