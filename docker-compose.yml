x-backend-image: &backend-image
  image: takeflow-backend:latest

x-backend-envfile: &backend-envfile
  env_file: .env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: takeflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - takeflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d takeflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - takeflow-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000
        "${STORAGE_S3_ACCESS_KEY}" "${STORAGE_S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/${STORAGE_S3_BUCKET}"
    restart: "no"

  api:
    <<: [*backend-image, *backend-envfile]
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile
    environment:
      DB_HOST: db
      BROKER_URL: redis://redis:6379
      RUN_MIGRATIONS: "1"  # the api owns schema migration
    ports:
      - "8000:8000"
    volumes:
      - takeflow-data:/data
      - takeflow-models:/models
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    <<: [*backend-image, *backend-envfile]
    environment:
      DB_HOST: db
      BROKER_URL: redis://redis:6379
      RUN_MIGRATIONS: "0"
    volumes:
      - takeflow-data:/data
      - takeflow-models:/models
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_started}
    command: ["python", "-m", "src.worker.main"]
    restart: unless-stopped

  relay:
    <<: [*backend-image, *backend-envfile]
    environment:
      DB_HOST: db
      BROKER_URL: redis://redis:6379
      RUN_MIGRATIONS: "0"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_started}
    command: ["python", "-m", "src.worker.relay"]
    restart: unless-stopped

volumes:
  takeflow-db:
  takeflow-data:
  takeflow-models:
  takeflow-minio:
