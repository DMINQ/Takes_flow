x-backend-image: &backend-image
  image: takeflow-backend:latest

x-backend-envfile: &backend-envfile
  env_file: .env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: takeflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - takeflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d takeflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-takeflow}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-takeflow-dev-secret}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - takeflow-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000
        "${STORAGE_S3_ACCESS_KEY:-takeflow}" "${STORAGE_S3_SECRET_KEY:-takeflow-dev-secret}" &&
        mc mb --ignore-existing "local/${STORAGE_S3_BUCKET:-takeflow}"
    restart: "no"

  whisper:
    # -gpu tag ships CUDA/cuDNN so faster-whisper can use the GPU.
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    environment:
      ASR_MODEL: ${TRANSCRIBER_REMOTE_MODEL:-base}
      ASR_ENGINE: faster_whisper
      ASR_DEVICE: ${TRANSCRIBER_REMOTE_DEVICE:-cuda}
      COMPUTE_TYPE: ${TRANSCRIBER_REMOTE_COMPUTE_TYPE:-float16}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    volumes:
      - takeflow-whisper-cache:/root/.cache/whisper
    healthcheck:
      # This image has no /health endpoint — /docs (Swagger UI) is always served.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  api:
    <<: [*backend-image, *backend-envfile]
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile
    environment:
      DB_HOST: db
      BROKER_URL: redis://redis:6379
      RUN_MIGRATIONS: "1"  # the api owns schema migration
    ports:
      - "8000:8000"
    volumes:
      - takeflow-data:/data
      - takeflow-models:/models
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    <<: [*backend-image, *backend-envfile]
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile
    environment:
      DB_HOST: db
      BROKER_URL: redis://redis:6379
      RUN_MIGRATIONS: "0"
    volumes:
      - takeflow-data:/data
      - takeflow-models:/models
    # The worker runs torch/pyannote (diarization) and, if TRANSCRIBER_DEVICE=cuda,
    # faster-whisper too — both benefit from the host GPU. The `api`/`relay`
    # services never touch a GPU, so they don't reserve one.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_started}
      whisper: {condition: service_healthy}
    command: ["python", "-m", "src.worker.main"]
    restart: unless-stopped

  relay:
    <<: [*backend-image, *backend-envfile]
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile
    environment:
      DB_HOST: db
      BROKER_URL: redis://redis:6379
      RUN_MIGRATIONS: "0"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_started}
    command: ["python", "-m", "src.worker.relay"]
    restart: unless-stopped

volumes:
  takeflow-db:
  takeflow-data:
  takeflow-models:
  takeflow-minio:
  takeflow-whisper-cache:
